<dialog
    id="delete-confirmation"
    class="delete-dialog"
    aria-labelledby="delete-confirmation-title"
    aria-describedby="delete-confirmation-description"
>
    <div class="delete-dialog-content">
        <span class="feature-icon mb-3">
            {% include "includes/icon.html" with name="trash" %}
        </span>
        <h2 id="delete-confirmation-title">Delete this prediction?</h2>
        <p id="delete-confirmation-description" class="text-muted">
            Are you sure you want to delete this prediction? This cannot be undone.
        </p>
        <div class="delete-dialog-actions">
            <button type="button" class="btn btn-outline-secondary" data-delete-cancel autofocus>
                Cancel
            </button>
            <button type="button" class="btn btn-danger" data-delete-confirm>
                Delete
            </button>
        </div>
    </div>
</dialog>
